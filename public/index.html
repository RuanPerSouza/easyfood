<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EasyFood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         CABEÇALHO
    =========================================== -->

    <header>
        <h1>🍴 EasyFood</h1>

        <p>
            Encontre os melhores restaurantes
        </p>
    </header>


    <main>

        <!-- ==========================================
             BUSCA
        =========================================== -->

        <section class="search-section">

            <input
                type="text"
                id="search"
                placeholder="Buscar restaurante..."
            >

        </section>


        <!-- ==========================================
             CATEGORIAS
        =========================================== -->

        <section class="categories-section">

            <h2>Categorias</h2>

            <div class="categories">

                <button
                    class="category-button active"
                    onclick="selecionarCategoria('Todos')"
                >
                    Todos
                </button>

                <button
                    class="category-button"
                    onclick="selecionarCategoria('Hambúrguer')"
                >
                    🍔 Hambúrguer
                </button>

                <button
                    class="category-button"
                    onclick="selecionarCategoria('Pizza')"
                >
                    🍕 Pizza
                </button>

                <button
                    class="category-button"
                    onclick="selecionarCategoria('Pastel')"
                >
                    🥟 Pastel
                </button>

                <button
                    class="category-button"
                    onclick="selecionarCategoria('Massa')"
                >
                    🍝 Massa
                </button>

                <button
                    class="category-button"
                    onclick="selecionarCategoria('Churrasco')"
                >
                    🥩 Churrasco
                </button>

                <button
                    class="category-button"
                    onclick="selecionarCategoria('Outros')"
                >
                    🍴 Outros
                </button>

            </div>

        </section>


        <!-- ==========================================
             RESTAURANTES
        =========================================== -->

        <section class="restaurants-section">

            <h2>Restaurantes</h2>

            <div id="restaurant-list">

                <p>
                    Carregando restaurantes...
                </p>

            </div>

        </section>


        <!-- ==========================================
             CADASTRO
        =========================================== -->

        <section class="register-section">

            <h2>Cadastrar Restaurante</h2>

            <form id="restaurant-form">

                <!-- Nome -->

                <div class="form-group">

                    <label for="name">
                        Nome do restaurante
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Ex: Pizzaria do Ruan"
                        required
                    >

                </div>


                <!-- Categoria -->

                <div class="form-group">

                    <label for="category">
                        Categoria
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Carregando categorias...
                        </option>

                    </select>

                </div>


                <!-- Avaliação -->

                <div class="form-group">

                    <label for="rating">
                        Avaliação
                    </label>

                    <input
                        type="number"
                        id="rating"
                        min="0"
                        max="5"
                        step="0.1"
                        placeholder="Ex: 4.5"
                    >

                </div>


                <!-- Botão -->

                <button
                    type="submit"
                    class="submit-button"
                >
                    Cadastrar Restaurante
                </button>

            </form>

        </section>

    </main>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

        <script src="script.js"></script>

</body>
</html>
